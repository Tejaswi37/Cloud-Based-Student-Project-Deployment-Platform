services:
  deployhub:
    build: .
    container_name: deployhub-platform
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_PATH: /data/platform.db
    volumes:
      - deployhub-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  deployhub-data:
