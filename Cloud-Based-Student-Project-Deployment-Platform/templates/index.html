<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudentDeploy</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<header><strong>☁ StudentDeploy</strong><button id="logout" class="outline hidden">Logout</button></header>
<main><section class="hero"><small>CLOUD-BASED PROJECT MANAGEMENT</small><h1>Student Project<br><span>Deployment Platform</span></h1>
<p>Submit, organize and track your academic projects in one place.</p></section>
<div id="message" class="message hidden"></div>
<section id="auth" class="columns">
<form id="login" class="panel"><h2>Student Login</h2>
<label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label>
<button>Login</button></form>
<form id="register" class="panel"><h2>Create Account</h2>
<label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label>
<label>Password (minimum 8 characters)<input name="password" type="password" minlength="8" required></label><button class="dark">Register</button></form>
</section>
<section id="dashboard" class="hidden"><h2>Welcome, <span id="student"></span></h2><div class="columns">
<form id="upload" class="panel"><h2>Submit Project</h2>
<label>Project title<input name="title" required></label><label>Description<textarea name="description" required rows="4"></textarea></label>
<label>Technology stack<input name="technology" placeholder="Python, Flask, Docker" required></label>
<label>Project ZIP file<input name="project_file" type="file" accept=".zip" required></label><small>ZIP only, maximum 50 MB.</small><button>Upload Project</button></form>
<section class="panel"><h2>My Projects</h2><button type="button" id="refresh" class="outline">Refresh</button><div id="projects"></div></section>
</div></section></main><footer>DevOps & Full Stack Course Project</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
